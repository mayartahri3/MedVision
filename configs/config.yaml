# ---------------------------------------------------------------
# CXR Assistant - central configuration (Phase 1: data)
# Paths default to Kaggle; override with --config or env CXR_DATA_ROOT
# ---------------------------------------------------------------
project:
  name: cxr-assistant
  seed: 42

paths:
  # Kaggle dataset "nih-chest-xrays/data". The mount point differs between
  # Kaggle versions, so every candidate is tried in order; the first one
  # containing Data_Entry_2017.csv wins. CXR_DATA_ROOT overrides all of them.
  raw_root:
    - /kaggle/input/datasets/nih-chest-xrays/data
    - /kaggle/input/nih-chest-xrays/data
    - /kaggle/input/data
  # Where resized images + processed CSVs are written
  cache_root: /kaggle/working/cache
  processed_dir: data/processed
  figures_dir: reports/figures

data:
  metadata_csv: Data_Entry_2017.csv
  bbox_csv: BBox_List_2017.csv
  official_test_list: test_list.txt
  official_trainval_list: train_val_list.txt
  # Images live in images_001/images ... images_012/images (searched recursively)
  image_glob: "images*/**/*.png"

labels:
  # All 14 NIH findings are trained (more supervision signal);
  # the dashboard focuses on `focus` labels.
  nih:
    - Atelectasis
    - Cardiomegaly
    - Effusion
    - Infiltration
    - Mass
    - Nodule
    - Pneumonia
    - Pneumothorax
    - Consolidation
    - Edema
    - Emphysema
    - Fibrosis
    - Pleural_Thickening
    - Hernia
  # NIH has no "Lung Opacity" label. We derive an approximation:
  # positive if ANY of these parenchymal-opacity findings is present.
  # (CheXpert/RSNA provide a native label - revisit when you add them.)
  derived:
    Lung_Opacity: [Infiltration, Consolidation, Pneumonia, Edema, Atelectasis]
  focus: [Pneumonia, Cardiomegaly, Lung_Opacity, Effusion]

split:
  # Test = official NIH test_list (already patient-disjoint).
  # Validation carved out of train_val BY PATIENT.
  val_fraction: 0.10
  # Keep only frontal views? NIH contains PA and AP.
  views: [PA, AP]

preprocess:
  cache_size: 320        # size images are resized to on disk (from 1024)
  image_size: 224        # network input (224 for DenseNet; 320 later if GPU allows)
  in_channels: 3         # grey repeated to 3 channels for ImageNet weights
  normalization: imagenet  # imagenet | xrv (torchxrayvision, used in Step 4)

augment:
  rotate_deg: 10
  scale: [0.9, 1.1]
  translate_frac: 0.05
  contrast_gamma: [0.8, 1.2]
  brightness: 0.1
  noise_std: 0.01
  prob: 0.5
  # NO horizontal flips: they move the heart to the right side and
  # corrupt laterality-dependent findings (Cardiomegaly).
  hflip: false

loader:
  batch_size: 32   # Kaggle T4 at 224px; use 8-16 locally (GTX 1650, 4 GB)
  num_workers: 4

# ---------------------------------------------------------------
# Phase 2: model, training, evaluation, explainability
# These are the BASELINE values. configs/experiments.yaml overrides them per
# experiment (python scripts/train.py --experiment <name>).
# ---------------------------------------------------------------
model:
  name: densenet121      # densenet121 | convnext_tiny | efficientnet_v2_s | efficientnet_b0 | resnet50
  pretrained: true       # ImageNet weights
  dropout: 0.2           # before the classifier

train:
  epochs: 15
  lr: 1.0e-4
  weight_decay: 1.0e-5
  amp: true              # mixed precision on GPU
  patience: 3            # early stopping on val mean AUROC (14 NIH labels)
  scheduler: plateau     # plateau | cosine
  lr_patience: 1         # plateau only: x0.1 after 1 epoch without gain
  warmup_epochs: 0       # cosine only: linear warm-up
  label_smoothing: 0.0   # targets -> y*(1-e) + e/2 ; helps with noisy NIH labels
  ema_decay: 0.0         # >0 enables an exponential moving average of weights (e.g. 0.999)
  pos_weight_clip: 50    # Hernia's raw neg/pos ratio (~500) destabilises training
  checkpoint_dir: /kaggle/working/checkpoints

mlflow:
  experiment: cxr-assistant
  system_metrics: true   # GPU/CPU/RAM usage curves (needs psutil + pynvml)
  log_model: true        # log the network with the MLflow PyTorch flavour
  register_model: false  # also push to the MLflow Model Registry (cxr-<experiment>)

eval:
  n_bootstrap: 500       # patient-level bootstrap for test-set 95% CIs
  tta: true              # test-time augmentation: average logits over a few mild zooms
  # 3-way status per label, thresholds fitted on VALIDATION:
  #   p <  t_low  -> negative   (t_low keeps `sensitivity` of positives above it)
  #   p >= t_high -> positive   (t_high keeps `specificity` of negatives below it)
  #   otherwise   -> uncertain
  band:
    sensitivity: 0.90
    specificity: 0.90
    per_label: {}        # e.g. {Pneumonia: {sensitivity: 0.85, specificity: 0.85}}
  sweep_targets: [0.80, 0.85, 0.90, 0.95]   # band-width table to justify the choice
  out_dir: /kaggle/working/eval

explain:
  pointing_tolerance_px: 15  # in 1024-px space, as in the Grad-CAM pointing-game protocol
  out_dir: /kaggle/working/explain
